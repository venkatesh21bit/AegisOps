apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: busybox:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            while true; do 
              echo "ERROR [auth-service] Unhandled exception in TokenValidator"
              echo 'java.lang.NullPointerException: Cannot invoke "java.util.Map.get(Object)" because "this.claims" is null'
              sleep 0.001
            done
